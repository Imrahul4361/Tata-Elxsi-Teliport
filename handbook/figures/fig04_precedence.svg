<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img"><title>Classification precedence</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="250" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0B3D91">Higher level wins (enforced in the kernel via provenance bits)</text><rect x="40" y="50" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#5C6670" stroke-width="2"/><text x="55" y="73" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#5C6670">1  Operating state</text><text x="55" y="92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">SHADOW: log only · DISABLED: bypass</text><line x1="250" y1="104" x2="250" y2="116" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="116" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#E03131" stroke-width="2"/><text x="55" y="139" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#E03131">2  Sanction</text><text x="55" y="158" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">envelope violation → BE (per flow, timed)</text><line x1="250" y1="170" x2="250" y2="182" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="182" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#2F9E44" stroke-width="2"/><text x="55" y="205" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2F9E44">3  Authenticated lease</text><text x="55" y="224" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">device → IV or RT (kernel set with timeout)</text><line x1="250" y1="236" x2="250" y2="248" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="248" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="2"/><text x="55" y="271" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#0B3D91">4  User rule / correction</text><text x="55" y="290" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">QoSmate-compatible + device/app/schedule</text><line x1="250" y1="302" x2="250" y2="314" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="314" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#1F6FEB" stroke-width="2"/><text x="55" y="337" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1F6FEB">5  App mark (DSCP)</text><text x="55" y="356" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">EF/CS5/VA→RT · AF4x/CS4/NQB→IV · CS1/LE→BK</text><line x1="250" y1="368" x2="250" y2="380" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="380" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#7048E8" stroke-width="2"/><text x="55" y="403" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#7048E8">6  Classifier</text><text x="55" y="422" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">ML singleton (conformal) · heuristics demote only</text><line x1="250" y1="434" x2="250" y2="446" stroke="#5C6670" stroke-width="1.8" marker-end="url(#a3)"/><rect x="40" y="446" width="420" height="54" rx="8" fill="#fff" fill-opacity="1" stroke="#868E96" stroke-width="2"/><text x="55" y="469" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#868E96">7  Default</text><text x="55" y="488" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5C6670">no mark → CAKE uses packet DSCP (BE after wash)</text><rect x="520" y="150" width="350" height="210" rx="10" fill="#FFF5F5" fill-opacity="1" stroke="#E03131" stroke-width="2"/><text x="695" y="178" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#E03131">Eligibility envelope</text><text x="540" y="205.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">Applies to every preferential class,</text><text x="540" y="220.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">including leases:</text><text x="540" y="236.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• RT ≤ max(1 Mbit/s, 2% S_base), ≤ 450 pps</text><text x="540" y="251.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• IV ≤ max(8 Mbit/s, 25% S_base)</text><text x="540" y="267.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• standing queue ≥ 3 s in a tin</text><text x="540" y="283.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">Violation → flow to BE for 60 s</text><text x="540" y="298.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">(×2 per repeat, cap 15 min)</text><line x1="462" y1="200" x2="518" y2="230" stroke="#E03131" stroke-width="1.8" marker-end="url(#a1)"/><line x1="462" y1="335" x2="518" y2="300" stroke="#E03131" stroke-width="1.8" marker-end="url(#a1)"/><rect x="520" y="395" width="350" height="120" rx="10" fill="#F3FBF6" fill-opacity="1" stroke="#2F9E44" stroke-width="2"/><text x="540" y="422.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">Single rule used everywhere:</text><text x="540" y="437.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">Classifier abstention alone never grants</text><text x="540" y="453.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">preference. A valid authenticated lease may</text><text x="540" y="468.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">grant preference to UNKNOWN traffic, subject</text><text x="540" y="484.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">to eligibility and operating-state checks.</text><text x="450" y="545" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">Heuristics may only demote or reset; preference always needs an explicit basis (C7).</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>Receipt timeline</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="60" y1="200" x2="860" y2="200" stroke="#ADB5BD" stroke-width="2"/><rect x="120" y="110" width="300" height="90" rx="6" fill="#FFF5F5" fill-opacity="0.9" stroke="#E03131" stroke-width="1.5"/><text x="270" y="135" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#E03131">10 s BEFORE</text><text x="270" y="160" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">median D = 46 ms</text><text x="270" y="180" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">Ĝ = 20.1 Mbit/s</text><rect x="500" y="110" width="300" height="90" rx="6" fill="#EBFBEE" fill-opacity="0.9" stroke="#2F9E44" stroke-width="1.5"/><text x="650" y="135" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2F9E44">10 s AFTER</text><text x="650" y="160" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">median D = 7 ms</text><text x="650" y="180" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">Ĝ = 18.0 Mbit/s</text><line x1="460" y1="80" x2="460" y2="215" stroke="#0B3D91" stroke-width="3"/><text x="460" y="70" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#0B3D91">action: RATE_CUT 95 → 18.1 (ACCEPT)</text><text x="460" y="245" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2F9E44">IMPROVED: D after &lt; 0.7 × D before, and Ĝ not reduced more than the cut</text><text x="460" y="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">INCONCLUSIVE if another action, a link event or a &gt; 30% load change overlaps the windows</text><text x="460" y="295" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670" font-style="italic">Receipts state association, not causation. Numbers are illustrative.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"><title>VeriQ packet path</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#0B3D91">UPLOAD (LAN → WAN)</text><rect x="20" y="50" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="95.0" y="76.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">LAN device</text><text x="95.0" y="91.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">packet</text><rect x="190" y="50" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="265.0" y="76.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">conntrack</text><text x="265.0" y="91.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">flow state</text><rect x="380" y="50" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="455.0" y="76.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">nft cls_up</text><text x="455.0" y="91.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">precedence → ct mark</text><rect x="560" y="50" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="635.0" y="76.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">nft mark_out</text><text x="635.0" y="91.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">ct mark → meta mark</text><rect x="730" y="50" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="805.0" y="76.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">CAKE egress</text><text x="805.0" y="91.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">fwmark 0x07000000</text><line x1="170" y1="80" x2="190" y2="80" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="340" y1="80" x2="380" y2="80" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="530" y1="80" x2="560" y2="80" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="710" y1="80" x2="730" y2="80" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="805" y1="110" x2="805" y2="140" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><text x="805" y="158" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">WAN → ISP</text><text x="30" y="215" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#0B3D91">DOWNLOAD (WAN → LAN)</text><rect x="20" y="235" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="95.0" y="261.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">WAN ingress</text><text x="95.0" y="276.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">packet arrives</text><rect x="190" y="235" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="265.0" y="261.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">tc act_ctinfo</text><text x="265.0" y="276.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">cpmark 0x7F000000</text><rect x="380" y="235" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="455.0" y="261.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">mirred redirect</text><text x="455.0" y="276.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">to ifb-veriq</text><rect x="560" y="235" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="635.0" y="261.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">CAKE on IFB</text><text x="635.0" y="276.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">fwmark tins</text><rect x="730" y="235" width="150" height="60" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="805.0" y="261.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1A1D21">forward → LAN</text><text x="805.0" y="276.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5C6670">nft envelope meters</text><line x1="170" y1="265" x2="190" y2="265" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="340" y1="265" x2="380" y2="265" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="530" y1="265" x2="560" y2="265" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="710" y1="265" x2="730" y2="265" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="20" y="330" width="860" height="120" rx="8" fill="#F4F7FB" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="40" y="355" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1A1D21">Why it works</text><text x="40" y="380.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• The class is decided once on the upload side and stored in the conntrack mark (bits 24–30).</text><text x="40" y="395.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• act_ctinfo copies that mark to every download packet BEFORE shaping, so one rule covers both directions.</text><text x="40" y="411.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• DSCP can be washed for Wi-Fi/ISP hygiene without losing the class (it lives in the mark, not in DSCP).</text><text x="40" y="426.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">• Syntax of ctinfo cpmark and the fwmark→tin mapping are verified by the Stage-1 self-test.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"><title>Physical demo kit</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="60" width="200" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="130.0" y="88.42999999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Client devices</text><text x="130.0" y="104.67999999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">laptop (call), phone,</text><text x="130.0" y="120.92999999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">mini-PC (bulk)</text><rect x="300" y="60" width="200" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#2F9E44" stroke-width="2.4"/><text x="400.0" y="96.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Raspberry Pi: VeriQ</text><text x="400.0" y="112.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">OpenWrt router (SUT)</text><rect x="570" y="60" width="200" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2.4"/><text x="670.0" y="96.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">ISP emulator</text><text x="670.0" y="112.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">Pi / mini-PC: tbf + netem</text><line x1="230" y1="100" x2="300" y2="100" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><text x="265.0" y="94.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">LAN</text><line x1="500" y1="100" x2="570" y2="100" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><text x="535.0" y="94.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">WAN</text><rect x="570" y="230" width="200" height="110" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="2.2"/><text x="670.0" y="265.37" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">ESP32 control box</text><text x="670.0" y="281.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">knob = capacity</text><text x="670.0" y="297.87" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">buttons: remote delay,</text><text x="670.0" y="314.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">lying reflector, kill</text><line x1="670" y1="230" x2="670" y2="142" stroke="#F08C00" stroke-width="1.8" marker-end="url(#a4)"/><text x="670.0" y="182.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">MQTT / WebSocket</text><rect x="300" y="230" width="200" height="110" rx="8" fill="#fff" fill-opacity="1" stroke="#7048E8" stroke-width="2"/><text x="400.0" y="265.37" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">LED strips + OLED</text><text x="400.0" y="281.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">WS2812B: one colour</text><text x="400.0" y="297.87" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">per class; OLED: S,</text><text x="400.0" y="314.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">state, evidence</text><line x1="570" y1="285" x2="500" y2="285" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><text x="535.0" y="279.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">GPIO</text><rect x="30" y="230" width="200" height="110" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="130.0" y="265.37" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Screen</text><text x="130.0" y="281.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">LuCI + 3D twin</text><text x="130.0" y="297.87" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">split-screen vs</text><text x="130.0" y="314.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">recorded baseline</text><line x1="400" y1="140" x2="400" y2="230" stroke="#5C6670" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a3)"/><text x="400.0" y="181.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">decision log</text><line x1="300" y1="140" x2="160" y2="230" stroke="#5C6670" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a3)"/><rect x="30" y="380" width="840" height="70" rx="8" fill="#FFF4E6" fill-opacity="1" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="5,4"/><text x="450" y="405.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">Safety: 5 V/3.3 V logic only, fused USB power, no mains wiring in the enclosure;</text><text x="450" y="421.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">the kit controls only the lab ISP emulator, never a real network.</text><text x="450" y="35" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">Judges turn the knob; VeriQ adapts from telemetry only</text></svg>
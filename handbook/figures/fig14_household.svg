<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img"><title>Household page wireframe</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="20" width="240" height="480" rx="26" fill="#fff" fill-opacity="1" stroke="#1A1D21" stroke-width="2.5"/><rect x="130" y="32" width="60" height="8" rx="4" fill="#ADB5BD" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="160" y="80" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">Is the internet OK?</text><circle cx="160" cy="170" r="55" fill="#EBFBEE" stroke="#2F9E44" stroke-width="4"/><text x="160" y="178" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#2F9E44">OK</text><text x="160" y="260.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">Calls and games are</text><text x="160" y="276.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">running smoothly.</text><rect x="70" y="330" width="180" height="44" rx="10" fill="#E7F0FF" fill-opacity="1" stroke="#1F6FEB" stroke-width="1.5"/><text x="160" y="358" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F6FEB">Protect my call</text><rect x="70" y="390" width="180" height="44" rx="10" fill="#F8F9FA" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="160" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1A1D21">Why is it slow?</text><rect x="330" y="20" width="240" height="480" rx="26" fill="#fff" fill-opacity="1" stroke="#1A1D21" stroke-width="2.5"/><rect x="420" y="32" width="60" height="8" rx="4" fill="#ADB5BD" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="450" y="80" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">Protect something</text><rect x="355" y="110" width="190" height="40" rx="8" fill="#F8F9FA" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="450" y="136" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">This phone</text><rect x="355" y="160" width="190" height="40" rx="8" fill="#E7F0FF" fill-opacity="1" stroke="#1F6FEB" stroke-width="1.5"/><text x="450" y="186" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">Asha-Laptop</text><rect x="355" y="210" width="190" height="40" rx="8" fill="#F8F9FA" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="450" y="236" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">PS5</text><rect x="355" y="290" width="58" height="36" rx="8" fill="#F8F9FA" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="384" y="313" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">30 min</text><rect x="420" y="290" width="58" height="36" rx="8" fill="#E7F0FF" fill-opacity="1" stroke="#1F6FEB" stroke-width="1.5"/><text x="449" y="313" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">1 h</text><rect x="485" y="290" width="58" height="36" rx="8" fill="#F8F9FA" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="514" y="313" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">2 h</text><rect x="360" y="370" width="180" height="48" rx="10" fill="#2F9E44" fill-opacity="1" stroke="#2F9E44" stroke-width="1.5"/><text x="450" y="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">Protect</text><text x="450" y="445.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">Max 2 at a time.</text><text x="450" y="459.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">Big downloads are not boosted.</text><rect x="620" y="20" width="240" height="480" rx="26" fill="#fff" fill-opacity="1" stroke="#1A1D21" stroke-width="2.5"/><rect x="710" y="32" width="60" height="8" rx="4" fill="#ADB5BD" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="740" y="80" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">Why is it slow?</text><circle cx="740" cy="160" r="45" fill="#FFF4E6" stroke="#F08C00" stroke-width="4"/><text x="740" y="168" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#F08C00">!</text><text x="740" y="240.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">The slowdown is outside</text><text x="740" y="256.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">your home, beyond your</text><text x="740" y="273.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">provider. Lowering your</text><text x="740" y="290.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">speed would not help,</text><text x="740" y="307.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1A1D21">so VeriQ is holding.</text><text x="740" y="400.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">Updated 20:52</text><text x="740" y="414.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">Details for admins in LuCI</text></svg>
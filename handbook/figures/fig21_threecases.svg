<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img"><title>Same symptom, three causes</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0B3D91">Symptom: probe delay rises by 40 ms. The correct action depends on WHERE the queue is.</text><rect x="25" y="60" width="270" height="330" rx="10" fill="#fff" fill-opacity="1" stroke="#E03131" stroke-width="2.4"/><text x="160" y="95" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#E03131">Access link slowed</text><rect x="45" y="120" width="230" height="110" rx="8" fill="#F4F7FB" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="160" y="145" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">evidence</text><text x="160" y="172.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">NEAR + FAR rise</text><text x="160" y="188.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">throughput drops</text><line x1="160" y1="232" x2="160" y2="270" stroke="#E03131" stroke-width="1.8" marker-end="url(#a1)"/><rect x="45" y="275" width="230" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#E03131" stroke-width="2"/><text x="160" y="305.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Cut to 0.9·Ĝ (one step)</text><rect x="315" y="60" width="270" height="330" rx="10" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2.4"/><text x="450" y="95" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#F08C00">Remote path congested</text><rect x="335" y="120" width="230" height="110" rx="8" fill="#F4F7FB" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="450" y="145" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">evidence</text><text x="450" y="172.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">FAR rises</text><text x="450" y="188.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">NEAR flat</text><text x="450" y="204.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">throughput normal</text><line x1="450" y1="232" x2="450" y2="270" stroke="#F08C00" stroke-width="1.8" marker-end="url(#a4)"/><rect x="335" y="275" width="230" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2"/><text x="450" y="305.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Hold</text><text x="450" y="321.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">a cut wastes bandwidth</text><rect x="605" y="60" width="270" height="330" rx="10" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2.4"/><text x="740" y="95" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#F08C00">Wi-Fi client weak</text><rect x="625" y="120" width="230" height="110" rx="8" fill="#F4F7FB" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="740" y="145" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">evidence</text><text x="740" y="172.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">station retries high</text><text x="740" y="188.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">FAR flat</text><line x1="740" y1="232" x2="740" y2="270" stroke="#F08C00" stroke-width="1.8" marker-end="url(#a4)"/><rect x="625" y="275" width="230" height="80" rx="8" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2"/><text x="740" y="305.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Hold + tell the user</text><text x="450" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">A delay-only autorate sees one number: it cuts in the first two cases and cannot explain the third (hypothesis to test).</text></svg>
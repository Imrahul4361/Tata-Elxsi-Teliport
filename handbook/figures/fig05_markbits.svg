old" fill="#1A1D21">PROV 0x38000000</text><text x="200" y="195" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">0 none · 1 default · 2 heuristic · 3 ML · 4 app mark · 5 user rule · 6 lease · 7 system</text><text x="30" y="225" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1A1D21">SANCT 0x40000000</text><text x="200" y="225" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">set by the envelope; class forced to BE until the kernel timeout expires</text><text x="30" y="255" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1A1D21">Example</text><text x="200" y="255" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">RT from a lease: CLASS 4, PROV 6 → 0x04000000 | 0x30000000 = 0x34000000</text></svg>
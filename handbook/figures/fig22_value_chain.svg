<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"><title>Value chain</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="80" width="200" height="200" rx="12" fill="#fff" fill-opacity="1" stroke="#2F9E44" stroke-width="2.4"/><rect x="20" y="80" width="200" height="42" rx="12" fill="#2F9E44" fill-opacity="1" stroke="#2F9E44" stroke-width="1.5"/><text x="120" y="108" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Household</text><text x="120" y="160.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">smooth calls &amp; games</text><text x="120" y="175.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">plain-language answers</text><text x="120" y="191.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">no new hardware</text><line x1="220" y1="180" x2="240" y2="180" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="240" y="80" width="200" height="200" rx="12" fill="#fff" fill-opacity="1" stroke="#1F6FEB" stroke-width="2.4"/><rect x="240" y="80" width="200" height="42" rx="12" fill="#1F6FEB" fill-opacity="1" stroke="#1F6FEB" stroke-width="1.5"/><text x="340" y="108" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">ISP / operator</text><text x="340" y="160.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">fewer 'slow internet' tickets (hypothesis)</text><text x="340" y="175.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">QoE evidence, TR-181/USP</text><text x="340" y="191.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">differentiated tier</text><line x1="440" y1="180" x2="460" y2="180" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="460" y="80" width="200" height="200" rx="12" fill="#fff" fill-opacity="1" stroke="#7048E8" stroke-width="2.4"/><rect x="460" y="80" width="200" height="42" rx="12" fill="#7048E8" fill-opacity="1" stroke="#7048E8" stroke-width="1.5"/><text x="560" y="108" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Gateway vendor</text><text x="560" y="160.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">OpenWrt/prplOS/RDK-B</text><text x="560" y="175.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">package, validated</text><text x="560" y="191.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">on their SoC</text><line x1="660" y1="180" x2="680" y2="180" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="680" y="80" width="200" height="200" rx="12" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="2.4"/><rect x="680" y="80" width="200" height="42" rx="12" fill="#0B3D91" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="780" y="108" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Tata Elxsi</text><text x="780" y="160.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">engineering services</text><text x="780" y="175.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">validation lab offering</text><text x="780" y="191.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A1D21">NEURON-style closed loop</text><text x="450" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0B3D91">Who gets value, and through whom (no Tata Elxsi endorsement implied)</text><text x="450" y="320" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670" font-style="italic">All operator benefits are hypotheses until an opt-in pilot measures them.</text></svg>
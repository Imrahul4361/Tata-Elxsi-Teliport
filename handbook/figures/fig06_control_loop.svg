<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>Control loop</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="15" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="64.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Observe</text><text x="64.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">tc, nft, probes</text><line x1="113" y1="102" x2="125" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="125" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="174.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Classify</text><text x="174.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">ML verdicts</text><line x1="223" y1="102" x2="235" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="235" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="284.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Estimate</text><text x="284.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">Ĝ, μ±σ, D</text><line x1="333" y1="102" x2="345" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="345" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="394.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Diagnose</text><text x="394.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">label + L0–L3</text><line x1="443" y1="102" x2="455" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="455" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="504.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Propose</text><text x="504.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">FSM action</text><line x1="553" y1="102" x2="565" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="565" y="70" width="98" height="64" rx="8" fill="#0B3D91" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="614.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#fff">CHECK</text><text x="614.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#fff">admit / refuse</text><line x1="663" y1="102" x2="675" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="675" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="724.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Enforce</text><text x="724.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">apply + read back</text><line x1="773" y1="102" x2="785" y2="102" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="785" y="70" width="98" height="64" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="834.0" y="98.625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Receipt</text><text x="834.0" y="114.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5C6670">10 s after</text><polyline points="841,134 841,180 64,180 64,136" fill="none" stroke="#5C6670" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a0)"/><text x="450" y="198" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5C6670">every tick = 250 ms; probes 10 pps total; receipts after 10 s</text><text x="450" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">One control tick (veriqd)</text><rect x="70" y="225" width="760" height="85" rx="8" fill="#F4F7FB" fill-opacity="1" stroke="#ADB5BD" stroke-width="1.5"/><text x="90" y="252.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">REJECT → logged with a refusal code (STALE_OBS, BELOW_FLOOR, CUT_BELOW_EVIDENCE, BUDGET_EXHAUSTED, …)</text><text x="90" y="267.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">SHADOW state → the whole loop runs, but rate and ML actions are only logged</text><text x="90" y="283.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A1D21">Enforcer refuses any command without an ACCEPT for the same action_id and config version</text></svg>
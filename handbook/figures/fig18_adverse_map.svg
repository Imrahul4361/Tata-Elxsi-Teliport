<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"><title>Adverse conditions by response</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="50" width="275" height="340" rx="10" fill="#fff" fill-opacity="1" stroke="#E03131" stroke-width="2.4"/><rect x="20" y="50" width="275" height="40" rx="10" fill="#E03131" fill-opacity="1" stroke="#E03131" stroke-width="1.5"/><text x="157" y="76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">CUT FAST (evidence supports it)</text><text x="38" y="120" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A1 capacity step down</text><text x="38" y="150" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A2 oscillating capacity</text><text x="38" y="180" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A3 recovery (probe up)</text><text x="38" y="210" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A19 ISP aggregation</text><text x="38" y="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A9 upload-only (that direction)</text><rect x="315" y="50" width="275" height="340" rx="10" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2.4"/><rect x="315" y="50" width="275" height="40" rx="10" fill="#F08C00" fill-opacity="1" stroke="#F08C00" stroke-width="1.5"/><text x="452" y="76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">HOLD (a cut cannot help)</text><text x="333" y="120" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A4 remote-path delay</text><text x="333" y="150" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A5 lying reflector</text><text x="333" y="180" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A7 base-RTT shift (re-learn)</text><text x="333" y="210" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A8 Wi-Fi bottleneck</text><text x="333" y="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A17 CPU-bound router</text><text x="333" y="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A28 radio loss</text><text x="333" y="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A29 idle link</text><text x="333" y="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A32 probe-path disturbance</text><rect x="610" y="50" width="275" height="340" rx="10" fill="#fff" fill-opacity="1" stroke="#5C6670" stroke-width="2.4"/><rect x="610" y="50" width="275" height="40" rx="10" fill="#5C6670" fill-opacity="1" stroke="#5C6670" stroke-width="1.5"/><text x="747" y="76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">DEGRADE TO STATIC (blind)</text><text x="628" y="120" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A6 all reflectors lost</text><text x="628" y="150" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A14 PPPoE / link flap</text><text x="628" y="180" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A15 daemon crash</text><text x="628" y="210" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A30 foreign qdisc change</text><text x="628" y="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A31 firewall flush (self-heal)</text><text x="628" y="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1A1D21">A24 offload enabled</text><text x="450" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0B3D91">Dominance invariant: when blind, VeriQ is static SQM; when sure, it acts; otherwise it holds</text><text x="450" y="412" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5C6670">Classification/intent conditions (A10–A13, A20–A23, A25–A27) are handled by the datapath and envelope.</text></svg>
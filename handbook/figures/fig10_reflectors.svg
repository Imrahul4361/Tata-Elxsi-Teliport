<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"><title>Near and far probes</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B3D91"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6670"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08C00"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="150" width="140" height="70" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="90.0" y="181.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Home LAN</text><text x="90.0" y="197.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">devices</text><rect x="200" y="150" width="150" height="70" rx="8" fill="#fff" fill-opacity="1" stroke="#2F9E44" stroke-width="2.2"/><text x="275.0" y="181.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">VeriQ router</text><text x="275.0" y="197.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">shaper + prober</text><rect x="400" y="150" width="150" height="70" rx="8" fill="#fff" fill-opacity="1" stroke="#F08C00" stroke-width="2.2"/><text x="475.0" y="181.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">Access link</text><text x="475.0" y="197.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">modem / ONT / FWA</text><rect x="590" y="150" width="130" height="70" rx="8" fill="#fff" fill-opacity="1" stroke="#1F6FEB" stroke-width="2.2"/><text x="655.0" y="181.49" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1D21">ISP first hop</text><text x="655.0" y="197.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5C6670">NEAR probe</text><line x1="160" y1="185" x2="200" y2="185" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="350" y1="185" x2="400" y2="185" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><line x1="550" y1="185" x2="590" y2="185" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#a0)"/><rect x="760" y="40" width="125" height="44" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="822.5" y="58.894999999999996" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Reflector</text><text x="822.5" y="73.27" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5C6670">1.1.1.1</text><line x1="720" y1="185" x2="760" y2="62" stroke="#5C6670" stroke-width="1.2" marker-end="url(#a3)"/><rect x="760" y="95" width="125" height="44" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="822.5" y="113.89500000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Reflector</text><text x="822.5" y="128.27" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5C6670">8.8.8.8</text><line x1="720" y1="185" x2="760" y2="117" stroke="#5C6670" stroke-width="1.2" marker-end="url(#a3)"/><rect x="760" y="280" width="125" height="44" rx="8" fill="#fff" fill-opacity="1" stroke="#0B3D91" stroke-width="1.5"/><text x="822.5" y="298.895" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">Reflector</text><text x="822.5" y="313.27" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5C6670">9.9.9.9</text><line x1="720" y1="185" x2="760" y2="302" stroke="#5C6670" stroke-width="1.2" marker-end="url(#a3)"/><rect x="760" y="330" width="125" height="44" rx="8" fill="#fff" fill-opacity="1" stroke="#E03131" stroke-width="1.5"/><text x="822.5" y="348.895" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1A1D21">App server</text><text x="822.5" y="363.27" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5C6670">remote path</text><line x1="720" y1="200" x2="760" y2="345" stroke="#E03131" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a1)"/><text x="450" y="270.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">Delay before the first hop (NEAR rises) → access link → a cut can help</text><text x="450" y="286.25" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">Delay only beyond the first hop (FAR rises, NEAR flat) → REMOTE → hold</text><text x="450" y="302.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1A1D21">One reflector rises alone → outlier → excluded (median of healthy reflectors)</text><text x="450" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0B3D91">Near/far probing localises the queue</text></svg>